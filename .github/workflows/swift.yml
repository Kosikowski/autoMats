# This workflow builds and tests a Swift project using Swift Testing with Xcode 16
# For more information, see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-15  # macOS 15 (Sequoia) includes Xcode 16

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode 16
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.0'  # Explicitly use Xcode 16.0 for Swift Testing

    - name: Verify Xcode Version
      run: xcodebuild -version  # Logs Xcode version for debugging

    - name: Verify Swift Version
      run: swift --version  # Confirms Swift 6.0 or later

    - name: Build
      run: swift build -v  # Builds the Swift package

    - name: Run Tests
      run: swift test -v  # Runs Swift Testing tests
